# cargo-deny configuration for KizunaLink
# See https://embarkstudios.github.io/cargo-deny/
# Run locally with: cargo deny check
#
# CI runs `cargo deny check advisories` (the RustSec vulnerability gate).
# The license/bans sections below are available for local use.

[advisories]
# Fail on any RustSec advisory, and on yanked crate versions.
yanked = "deny"
# Override the default database path if you have a local checkout.
# db-path = "~/.cargo/advisory-db"

[licenses]
# KizunaLink is MIT-licensed. Allow-list permissive licenses explicitly; anything not
# listed here (strong copyleft included) fails `cargo deny check licenses`.
# (cargo-deny >= 0.16 removed the `default`/`copyleft` keys — see EmbarkStudios/cargo-deny#611.)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "OpenSSL",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
