[package]
name = "kizunalink"
version = "0.1.0"
edition = "2021"
authors = ["Nikhil <codexnik23@gmail.com>"]
description = "High-Performance Standalone Discord Audio Streaming Engine in Rust"
license = "MIT"

[dependencies]
kizuna-voice = { path = "kizuna-voice" }
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }
futures-util = "0.3"
async-trait = "0.1"

reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
bytes = "1.6"
base64 = "0.22"
urlencoding = "2.1"
url = "2.5"

audiopus_sys = { version = "0.2", features = ["static"] }
symphonia = { version = "0.5", features = ["all"] }
rubato = "0.14"

# DAVE (Discord Audio/Video End-to-end encryption) support
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
openmls = "0.9"
openmls_rust_crypto = "0.6"
openmls_basic_credential = "0.6"
tls_codec = "0.5"

# Native plugin loading (.so / .dylib / .dll)
libloading = "0.8"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "5.5"
dotenvy = "0.15"
num_cpus = "1.16"
rand = "0.8"
rhai = { version = "1.25.1", features = ["sync"] }
sysinfo = "0.31"
ctrlc = "3.4"
prometheus = { version = "0.13", features = ["process"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
members = [
    ".",
    "kizuna-voice"
]
