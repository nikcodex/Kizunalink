[package]
name = "kizunalink"
version = "0.1.0"
edition = "2021"
authors = ["Nikhil <kai._.dev>"]
description = "High-Performance Standalone Discord Audio Streaming Engine in Rust"
license = "MIT"

[dependencies]
# Async Runtime & Web Server
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
futures-util = "0.3"

# Networking & HTTP
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.6"
base64 = "0.22"
urlencoding = "2.1"

# Discord Voice & Audio Protocol
songbird = { version = "0.4", default-features = false, features = ["builtin-queue", "gateway", "driver", "rustls"] }
symphonia = { version = "0.5", features = ["all"] }
audiopus = "0.3"
rubato = "0.15"

# Utilities & Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "5.5"
dotenvy = "0.15"
num_cpus = "1.16"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
