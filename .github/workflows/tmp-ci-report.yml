name: TMP CI Report

# TEMPORARY diagnostic workflow: this sandbox cannot download Actions log blobs,
# so toolchain output is committed to _ci/ on the branch and read back through
# the contents API. Removed again before the final state of the branch; the real
# gates in ci.yml/build.yml stay strict and are not touched by this file.

on:
  push:
    branches: [arena/01a06f50-kizunalink]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  report:
    name: Toolchain report
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a06f50-kizunalink
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake
      - run: mkdir -p _ci
      - name: rustfmt (whole workspace)
        run: cargo fmt --all --check > _ci/fmt-all.txt 2>&1 || true
      - name: clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings > _ci/clippy.txt 2>&1 || true
      - name: tests
        run: cargo test --workspace --all-targets --all-features > _ci/test.txt 2>&1 || true
      - name: summary
        run: |
          {
            echo "fmt-all exit lines: $(wc -l < _ci/fmt-all.txt)"
            echo "clippy warnings/errors: $(grep -c -E '^(warning|error)' _ci/clippy.txt || true)"
            grep -E '^(warning|error)' _ci/clippy.txt | head -40 || true
            echo "--- test totals ---"
            grep -E 'test result:' _ci/test.txt || true
            echo "--- failures ---"
            grep -E '^(failures:|---- )' _ci/test.txt | head -40 || true
          } > _ci/summary.txt
          cat _ci/summary.txt
      - name: publish report
        run: |
          git config user.name "kizunalink-ci-report[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f _ci
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): temporary toolchain report [skip ci]"
            git push origin HEAD:arena/01a06f50-kizunalink
          else
            echo "no report changes"
          fi
