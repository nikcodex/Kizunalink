name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  LIBOPUS_STATIC: "1"
  OPUS_STATIC: "1"
  AUDIOPUS_STATIC: "1"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Install libopus
        run: sudo apt-get update && sudo apt-get install -y libopus-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libclang-dev clang build-essential perl
      - run: cargo check
