name: CI

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake
      - run: cargo check --workspace --all-targets --all-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake
      - name: Clippy
        id: clippy
        continue-on-error: true
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/clippy.log
      - name: Post clippy diagnostics to commit
        if: steps.clippy.outcome == 'failure'
        env:
          TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > /tmp/body.json
          import json, re, subprocess
          log = open('/tmp/clippy.log', errors='replace').read()
          log = re.sub(r'\x1b\[[0-9;]*m', '', log)
          keep = []
          for i, line in enumerate(log.splitlines()):
              if line.startswith('error') or line.startswith('warning') or '-->' in line:
                  keep.extend(log.splitlines()[max(0, i - 1):i + 6])
          text = '\n'.join(dict.fromkeys(keep))[:60000] or 'no diagnostics captured'
          print(json.dumps({'body': '```\n' + text + '\n```'}))
          PY
          curl -s -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/body.json
      - name: Fail on clippy diagnostics
        if: steps.clippy.outcome == 'failure'
        run: exit 1

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # --all covers every workspace member (kizunalink + kizuna-voice);
      # without it only the root package is checked.
      - run: cargo fmt --all --check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake
      - run: cargo test --workspace --all-targets --all-features

  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check, test, clippy, fmt]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake
      - run: cargo build --workspace --release
      - uses: actions/upload-artifact@v4
        with:
          name: kizunalink-linux-amd64
          path: target/release/kizunalink
