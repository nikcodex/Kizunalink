name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  LIBOPUS_STATIC: "1"
  OPUS_STATIC: "1"
  AUDIOPUS_STATIC: "1"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libclang-dev clang build-essential perl libopus-dev
      - name: cargo check
        run: |
          set -o pipefail
          cargo check --workspace --all-targets 2>&1 | tee /tmp/check.log | perl -e '
            my $m = "";
            while (<STDIN>) {
              if (/^error(?:\[[^\]]+\])?:\s*(.*)$/) { $m = $1; }
              elsif (/^\s*-->\s*([^:]+):(\d+):(\d+)/ && $m ne "") {
                print "::error file=$1,line=$2,col=$3::$m\n";
                $m = "";
              }
            }
          '
      - name: Surface check failure
        if: failure()
        run: |
          if [ -f /tmp/check.log ]; then
            tail -c 30000 /tmp/check.log | tr '\n' ' ' > /tmp/tail.txt
            echo "::error file=ci-check.log,line=1::$(cat /tmp/tail.txt)"
          fi

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libclang-dev clang build-essential perl libopus-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libclang-dev clang build-essential perl libopus-dev
      - run: cargo test --workspace --all-targets

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libclang-dev clang build-essential perl libopus-dev
      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install opus cmake pkg-config
      # Windows relies on audiopus_sys building libopus from source via the
      # LIBOPUS_STATIC/OPUS_STATIC/AUDIOPUS_STATIC env vars set at the top.
      - run: cargo build --release --workspace

  deny:
    name: Cargo Deny (advisories)
    runs-on: ubuntu-latest
    # Non-blocking for now: surfaces RustSec advisories without failing the
    # build while the advisory backlog is triaged.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v1
        with:
          command: check advisories
