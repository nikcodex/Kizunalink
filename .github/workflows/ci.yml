name: CI

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake
      - run: cargo check --workspace --all-targets --all-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake
      - name: Run Clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee clippy.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-log
          path: clippy.log

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # --all covers every workspace member (kizunalink + kizuna-voice);
      # without it only the root package is checked.
      - name: Generate formatting patch
        run: cargo fmt --all
      - if: always()
        run: git diff --binary > rustfmt.patch
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch
      - run: git diff --exit-code

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake
      - name: Run tests
        run: |
          set -o pipefail
          cargo test --workspace --all-targets --all-features 2>&1 | tee test.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log

  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check, test, clippy, fmt]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake
      - run: cargo build --workspace --release
      - uses: actions/upload-artifact@v4
        with:
          name: kizunalink-linux-amd64
          path: target/release/kizunalink
