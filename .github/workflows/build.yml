name: Build KizunaLink Engine

on:
  push:
    # TEMPORARY: verify ARM64/Termux on this branch. Revert to [ "main" ].
    branches: [ "main", "arena/01a06f22-kizunalink" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LIBOPUS_STATIC: "1"
  OPUS_STATIC: "1"

jobs:
  build-linux-x86_64:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libopus-dev

      - name: Install Rust Toolchain (x86_64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu

      - name: Build Release Binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Upload x86_64 Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kizunalink-linux-x86_64
          path: target/x86_64-unknown-linux-gnu/release/kizunalink
          if-no-files-found: error
          retention-days: 90

  build-linux-arm64:
    name: Build (Linux ARM64 / Termux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libopus-dev

      - name: Install Rust Toolchain (ARM64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-unknown-linux-gnu

      - name: Setup Zig
        uses: korandoru/setup-zig@v1
        with:
          zig-version: 0.13.0

      - name: Install cargo-zigbuild
        run: pip install cargo-zigbuild

      - name: Build Release Binary (ARM64)
        run: cargo zigbuild --release --target aarch64-unknown-linux-gnu

      - name: Upload ARM64 Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kizunalink-linux-arm64
          path: target/aarch64-unknown-linux-gnu/release/kizunalink
          if-no-files-found: error
          retention-days: 90
