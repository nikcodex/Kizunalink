<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="KizunaLink logo">
  <defs>
    <linearGradient id="kz-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4d6d"/>
      <stop offset="100%" stop-color="#c9184a"/>
    </linearGradient>
  </defs>
  <!-- Torii gate -->
  <g fill="url(#kz-grad)">
    <!-- kasagi (top beam, curved) -->
    <path d="M40 118 Q256 72 472 118 L462 150 Q256 108 50 150 Z"/>
    <!-- nuki (second beam) -->
    <rect x="86" y="188" width="340" height="30" rx="4"/>
    <!-- gakuzuka (center tablet) -->
    <rect x="236" y="148" width="40" height="42" rx="4"/>
    <!-- pillars -->
    <rect x="118" y="140" width="40" height="332" rx="6"/>
    <rect x="354" y="140" width="40" height="332" rx="6"/>
  </g>
  <!-- Sound wave / link between pillars -->
  <g fill="none" stroke="url(#kz-grad)" stroke-width="22" stroke-linecap="round">
    <path d="M186 330 v40"/>
    <path d="M221 300 v100"/>
    <path d="M256 270 v160"/>
    <path d="M291 300 v100"/>
    <path d="M326 330 v40"/>
  </g>
</svg>
