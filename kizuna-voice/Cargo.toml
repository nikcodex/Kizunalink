[package]
name = "kizuna-voice"
version = "0.1.0"
edition = "2021"

[dependencies]
symphonia = { version = "0.5", features = ["all"] }
async-trait = "0.1"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-tungstenite = { version = "0.21.0", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
byteorder = "1.5"

# DAVE crypto
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
openmls = "0.9"
openmls_rust_crypto = "0.6"
openmls_basic_credential = "0.6"

[[bin]]
name = "test_bin"
path = "src/bin.rs"

